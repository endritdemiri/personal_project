<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>


    <header>
        <img src="logooo.png" alt="Classic Looks Logo" class="logo">

        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
        <button id="cart-btn" type="button" aria-controls="cart-drawer" aria-expanded="false">
            <img src="images/shporta.jpg" alt="">
            <span>Shporta</span>
            <span id="cart-badge">0</span>
        </button>
    </header>

    <section id="Main-Page">

        <div class="contact-container">

            <h1>Contact Us</h1>

            <p class="contact-description">We'd love to hear from you! Get in touch with Classic Looks.</p>

            <div class="contact-box">

                <form id="contact-form">

                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>

                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" placeholder="Enter the subject" required>

                    <label for="message">Message:</label>
                    <textarea rows="5" id="message" name="message" placeholder="Enter your message" required></textarea>

                    <button type="submit">Save Message on This Device</button>


                </form>
                <p id="contact-status" role="status"></p>



            </div>



        </div>

        
    </section>



    <!-- CART BACKDROP -->
    <div id="cart-backdrop" class="backdrop hidden"></div>

    <!-- SHOPPING CART -->
    <aside id="cart-drawer" class="cart-drawer" inert>

        <div class="cart-header">
            <h3>Shporta Juaj</h3>

            <button id="close-cart" class="close-btn" aria-label="Mbyll shportën">
                &times;
            </button>
        </div>

        <div id="cart-items" class="cart-items"></div>

        <div class="cart-footer">

            <div class="cart-total-row">
                <span>Totali:</span>
                <span id="cart-total" class="cart-total-price">
                    0.00 €
                </span>
            </div>

            <button id="checkout-btn" class="btn-primary full-width">
                Ruaj porosinë në këtë pajisje
            </button>

        </div>

    </aside>

    <div id="toast" class="toast">
        Produkti u shtua në shportë!
    </div>
    <script src="js/main.js"></script>
</body>
</html>
